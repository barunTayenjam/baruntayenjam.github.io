name: Regenerate OG Image
on:
  schedule:
    - cron: "0 0 1 */3 *" # quarterly
  push:
    paths: [scripts/gen-og.py, content.json]
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: pip install pillow
      - name: Generate image
        run: python scripts/gen-og.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate og-image.png"
          file_pattern: og-image.png
