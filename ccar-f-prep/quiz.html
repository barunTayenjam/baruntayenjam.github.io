<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CCAR-F Quiz</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --accent: #d97757; --ok: #3a7d44; --bad: #c00000;
    --border: #e5e2dc; --chip: #ece9e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --card: #211f1c; --text: #f0eee9; --muted: #9a968e;
      --accent: #e08b6d; --ok: #6dbb78; --bad: #ff7b6b;
      --border: #38342e; --chip: #2b2925;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100dvh;
  }
  nav.top {
    flex-shrink: 0; text-align: center; padding: .55rem .9rem;
    border-bottom: 1px solid var(--border);
  }
  nav.top a { color: var(--accent); text-decoration: none; font-size: .85rem; padding: .3rem .7rem; }
  nav.top a.cur { color: var(--text); font-weight: 600; }
  main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1rem .9rem 1rem; }
  .wrap { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: clamp(1.5rem, 6vw, 2.1rem); letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: .9rem; margin: .3rem 0 1.3rem; }
  .card {
    display: flex; align-items: center; gap: .9rem;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.1rem; margin-bottom: .65rem; cursor: pointer; width: 100%;
    text-align: left; color: var(--text); font: inherit;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); }
  .badge {
    flex-shrink: 0; width: 2.3rem; height: 2.3rem; border-radius: 50%;
    background: var(--chip); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .95rem;
  }
  .cinfo { flex: 1; min-width: 0; }
  .cname { font-weight: 600; }
  .cscore { color: var(--muted); font-size: .8rem; margin-top: .15rem; }
  .qhead { display: flex; justify-content: space-between; color: var(--muted); font-size: .78rem; margin-bottom: .7rem; }
  .scenario {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: .9rem 1rem; font-size: .9rem; line-height: 1.5; color: var(--muted); margin-bottom: .8rem;
  }
  .qtext { font-size: clamp(1.05rem, 4vw, 1.25rem); font-weight: 600; line-height: 1.4; margin-bottom: 1rem; }
  .opt {
    display: flex; gap: .7rem; align-items: flex-start;
    background: var(--card); border: 1.5px solid var(--border); border-radius: 12px;
    padding: .85rem .95rem; margin-bottom: .55rem; cursor: pointer; width: 100%;
    text-align: left; color: var(--text); font: inherit; font-size: .95rem; line-height: 1.45;
  }
  .opt .key {
    flex-shrink: 0; width: 1.55rem; height: 1.55rem; border-radius: 8px;
    background: var(--chip); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .8rem; margin-top: .05rem;
  }
  .opt.sel { border-color: var(--accent); }
  .opt.sel .key { background: var(--accent); color: #fff; }
  .opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--card)); }
  .opt.right .key { background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--card)); }
  .opt.wrong .key { background: var(--bad); color: #fff; }
  .opt:disabled { cursor: default; }
  .explain {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: .9rem 1rem; font-size: .88rem; line-height: 1.5; margin: .8rem 0;
  }
  .explain .verdict { font-weight: 700; margin-bottom: .3rem; }
  .actions { display: flex; gap: .6rem; margin-top: .9rem; }
  .actions button {
    flex: 1; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: .8rem; font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions button:disabled { opacity: .4; }
  .score-big { font-size: 3rem; font-weight: 700; letter-spacing: -.03em; }
  .verdict-line { font-size: 1.05rem; margin: .4rem 0 1rem; }
  .bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: .8rem 0 1.2rem; }
  .bar > div { height: 100%; background: var(--accent); }
  .recap { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
  .recap span {
    width: 2rem; height: 2rem; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: .75rem; font-weight: 600; background: var(--chip); color: var(--muted);
  }
  .recap span.ok { background: var(--ok); color: #fff; }
  .recap span.bad { background: var(--bad); color: #fff; }
  #timerbar {
    flex-shrink: 0; text-align: center; padding: .3rem .9rem;
    font-size: .82rem; font-variant-numeric: tabular-nums; color: var(--muted);
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  #timerbar.late { color: var(--bad); font-weight: 700; }
  .breakdown { margin: .6rem 0 1rem; display: flex; flex-direction: column; gap: .4rem; }
  .brow { display: flex; align-items: center; gap: .6rem; font-size: .85rem; }
  .brow > span:first-child { width: 1.9rem; font-weight: 700; flex-shrink: 0; }
  .bbar { flex: 1; height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .bbar > span { display: block; height: 100%; background: var(--accent); }
  .brow.weak .bbar > span { background: var(--bad); }
  .brow > span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
  .rblock { margin-bottom: 1.6rem; }
  .rblock .opt { cursor: default; }
  .rok { color: var(--ok); font-weight: 700; }
  .rbad { color: var(--bad); font-weight: 700; }
  .palette { margin-top: 1.2rem; }
  .pdots { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .5rem; }
  .pdot {
    width: 1.9rem; height: 1.9rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--chip); color: var(--muted); font-size: .68rem; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; padding: 0;
  }
  .pdot.done { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pdot.flag { background: var(--bad); border-color: var(--bad); color: #fff; }
  .pdot.cur { outline: 2px solid var(--text); outline-offset: 1px; }
</style>

<script>
const QUESTIONS = [{"domain":1,"scenario":"A developer is implementing the control flow for a customer support agent built on the Claude Agent SDK. During testing, the agent calls get_customer, and the API response arrives with stop_reason \"tool_use\". The team is unsure how the loop should decide whether to keep iterating or stop.","question":"How should the loop's continue/terminate decision be implemented?","options":["Continue when stop_reason is \"tool_use\": execute the requested tool, append its result to the conversation history, and terminate when stop_reason is \"end_turn\".","Terminate as soon as the response contains assistant text content, since text alongside a tool call signals the model is done reasoning.","Parse the assistant's natural language for phrases like \"task complete\" or \"I have finished\" to decide when to stop.","Set an arbitrary iteration cap as the primary stopping mechanism and end the loop when the cap is reached."],"answer":[0],"explain":"The agentic loop continues while stop_reason is \"tool_use\" and terminates on \"end_turn\", with tool results appended between iterations so the model reasons over fresh information. Checking for assistant text content and parsing natural-language completion signals are both named anti-patterns, because models legitimately interleave text with tool calls mid-task. An iteration cap is a guardrail, not the primary stopping mechanism."},{"domain":1,"scenario":"A coordinator agent is configured to delegate research subtasks to web-search, document-analysis, and synthesis subagents. When it runs, it tries to spawn subagents but the Task tool is not available to it, so delegation never happens and the coordinator attempts every step itself.","question":"What configuration change fixes this?","options":["Add \"Task\" to the coordinator's allowedTools so it can invoke subagents.","Grant subagents automatic access to the coordinator's conversation history so they pick up pending tasks on their own.","Configure the subagents to poll a shared memory store for new assignments from the coordinator.","Inline the subagent definitions into the coordinator's system prompt so it can execute their roles itself."],"answer":[0],"explain":"The Task tool is the mechanism for spawning subagents, and a coordinator can only invoke subagents if its allowedTools includes \"Task\". The inheritance distractor reflects the common misconception the guide calls out explicitly: subagents operate with isolated context and do not automatically receive the coordinator's conversation history, so polling or inheritance is never the fix."},{"domain":1,"scenario":"A support agent's system prompt includes the instruction \"never issue refunds above $500; escalate to a human instead.\" In production, an occasional refund above $500 still executes through process_refund. The business rule must hold 100% of the time.","question":"What should the architect implement?","options":["A tool call interception hook that blocks process_refund above the threshold and redirects to the human-escalation workflow.","A PostToolUse hook that detects the over-limit refund after it executes and files a correction ticket.","A stronger, more detailed prompt instruction with worked examples of prohibited refunds.","A higher iteration cap so the model has room to re-read the policy before acting."],"answer":[0],"explain":"Prompt instructions provide only probabilistic compliance with a non-zero failure rate; hooks that intercept outgoing tool calls enforce compliance deterministically and redirect to alternative workflows like human escalation. The PostToolUse distractor is the classic error: it fires after the refund has already executed, so it can document the violation but never prevent it."},{"domain":1,"scenario":"An engineer resumes a debugging session two weeks later using --resume <session-name>. In the interim, the files that session had already read and analyzed were heavily refactored, so its earlier tool results no longer match the current code.","question":"What is the most reliable approach?","options":["Start a new session seeded with a structured summary of the prior findings, rather than resuming with stale tool results.","Resume the old session unchanged so the agent reuses its cached file reads and stays fast.","Fork the stale session twice and cross-check the outdated results between the two branches.","Resume the old session and instruct the agent to trust its earlier file reads unless it hits a runtime error."],"answer":[0],"explain":"The guide states that starting fresh with an injected structured summary is more reliable than resuming a session whose prior tool results are stale; resumption is appropriate only when prior context is mostly still valid. The unchanged-resume distractor reuses file contents that no longer exist, silently corrupting the agent's analysis."},{"domain":1,"scenario":"A team has completed a shared codebase analysis in one long session. They now want to compare two competing testing strategies — pytest fixtures versus property-based testing — without redoing the baseline analysis, and without either exploration contaminating the other's conclusions.","question":"Which session-management design fits best?","options":["Use fork_session to create two independent branches from the shared analysis baseline, exploring one strategy per branch.","Resume the original session twice with --resume, running strategy A to completion and then strategy B in the same conversation.","Start two brand-new sessions and paste the raw tool transcripts from the baseline session into each prompt.","Stay in the original session and explore both strategies sequentially so they share the full history."],"answer":[0],"explain":"fork_session exists precisely for creating independent branches from a shared analysis baseline to explore divergent approaches, giving isolation without redoing the baseline. The sequential-resume distractor keeps both explorations in one shared context, so strategy B reasons over strategy A's conclusions — exactly the contamination the team wants to avoid."},{"domain":1,"scenario":"In a multi-agent research system, the web-search subagent finishes and could hand its findings straight to the synthesis subagent. The team proposes direct subagent-to-subagent message passing to cut latency and reduce the coordinator's token usage.","question":"What should the architect recommend?","options":["Route all findings through the coordinator, which aggregates and forwards them, preserving observability, consistent error handling, and controlled information flow.","Allow direct peer-to-peer transfer between subagents, since the coordinator hop only adds latency.","Have every subagent write to a shared blackboard that all other subagents read directly.","Have the web-search subagent spawn the synthesis subagent itself, eliminating the coordinator entirely for this path."],"answer":[0],"explain":"The guide's hub-and-spoke architecture routes all inter-subagent communication through the coordinator specifically for observability, consistent error handling, and controlled information routing. The direct-transfer distractor optimizes latency while giving up every one of those guarantees — a failed or malformed result would bypass the coordinator's error handling entirely."},{"domain":1,"scenario":"A payments team wants their agent to always run get_customer and confirm a verified identity before any process_refund, while still letting Claude adaptively decide which tools each individual request needs — order lookup, refund, or escalation. They are considering hard-coding one fixed tool sequence for every request.","question":"Which design correctly assigns determinism versus model-driven decision-making?","options":["Enforce the identity check programmatically — a prerequisite gate or tool-call interception hook that blocks process_refund until get_customer has returned a verified ID — while letting Claude reason from context about which tools each request needs.","Hard-code the full tool sequence for every request, so behavior is fully deterministic and identity verification can never be skipped.","Keep the entire flow model-driven and move the identity-verification requirement into a detailed system prompt with examples.","Pre-configure a decision tree mapping request types to tool sequences, using the model only to phrase the customer-facing messages."],"answer":[0],"explain":"The guide draws the line at compliance points: model-driven tool selection is the point of an agentic loop, but deterministic requirements like identity verification belong in programmatic enforcement (hooks, prerequisite gates), because prompt instructions alone have a non-zero failure rate. The fixed-sequence distractor achieves determinism by destroying adaptability — it turns the agent into the pre-configured decision tree the architecture explicitly distinguishes itself from."},{"domain":1,"scenario":"A coordinator is about to invoke the synthesis subagent for a research report. Earlier, the web-search subagent returned findings with source URLs and the document-analysis subagent returned findings with document names and page numbers. The first draft came back well-written but with every citation lost.","question":"Which TWO practices should the coordinator apply when invoking the synthesis subagent?","options":["Include the complete findings from both prior subagents directly in the synthesis subagent's prompt.","Pass the findings in a structured data format that separates content from metadata such as source URLs, document names, and page numbers.","Tell the synthesis subagent to pull whatever context it needs, since it inherits the coordinator's conversation history automatically.","Give the synthesis subagent step-by-step procedural instructions specifying exactly how to write each section of the report."],"answer":[0,1],"explain":"Subagent context must be explicit in the prompt — complete prior findings passed in full, with structured formats separating content from metadata so attribution survives the handoff. The inheritance option contradicts isolated subagent context (no automatic parent history), and the procedural-instructions option inverts the guide's rule: coordinator prompts should specify research goals and quality criteria, not step-by-step procedures, so subagents stay adaptable."},{"domain":1,"scenario":"A research coordinator serves queries ranging from quick fact lookups to broad investigations. The current version runs every query through the full web-search → document-analysis → synthesis pipeline, produces noticeably duplicated coverage across subagents, and occasionally ships reports with uncovered subtopics.","question":"Which THREE design changes address these problems?","options":["Analyze each query's requirements and dynamically select which subagents to invoke, rather than always routing through the full pipeline.","Partition the research scope across subagents by assigning distinct subtopics or source types to minimize duplication.","After synthesis, evaluate the output for gaps and re-delegate to search and analysis subagents with targeted queries until coverage is sufficient.","Decompose topics as narrowly as possible so each subagent handles a single micro-query, maximizing per-agent focus."],"answer":[0,1,2],"explain":"Dynamic subagent selection based on query complexity, scope partitioning by subtopic or source type, and iterative refinement that re-delegates with targeted queries are all coordinator skills the guide lists for exactly these failure modes. The narrow-decomposition distractor is the guide's named risk: overly narrow task decomposition leads to incomplete coverage of broad research topics, worsening the gap problem."},{"domain":1,"scenario":"A support agent integrates MCP tools from two vendors. One returns order timestamps as Unix epoch integers, the other as ISO 8601 strings, and status codes differ numerically per vendor — the model keeps misjudging order recency. Separately, compliance requires that refunds run only after get_customer has returned a verified customer ID, with no exceptions ever.","question":"Which TWO hook placements are correct for these two requirements?","options":["A PostToolUse hook that normalizes the heterogeneous timestamps and status codes before the model processes the tool results.","A tool call interception hook that blocks process_refund until get_customer has returned a verified customer ID.","A PostToolUse hook attached to process_refund that re-checks the verified ID after the refund has executed.","A system prompt section instructing the model to convert timestamps itself and to verify IDs before acting."],"answer":[0,1],"explain":"PostToolUse hooks intercept tool results for transformation before the model processes them — the guide's pattern for normalizing Unix timestamps, ISO 8601, and status codes — while outgoing-call interception enforces compliance rules deterministically as a prerequisite gate. The PostToolUse-on-refund distractor fires only after the financial action has completed, too late to block it, and the prompt distractor offers probabilistic rather than guaranteed compliance."},{"domain":2,"scenario":"A customer support resolution agent exposes get_customer and lookup_order through MCP. Both carry the description \"Fetches account information from the backend database.\" In testing, the model repeatedly calls get_customer when users ask about order status, stalling resolution on order inquiries.","question":"What should the architect do to fix the misrouting?","options":["Merge get_customer and lookup_order into a single retrieve_data tool that accepts a record type parameter","Force the correct tool per incoming request using tool_choice {\"type\": \"tool\", \"name\": \"lookup_order\"} in the routing layer","Rewrite each description to state the tool's distinct purpose, expected inputs and outputs, and when to use it versus the similar alternative","Rename get_customer to customer-order-lookup so its name matches more user phrasings"],"answer":[2],"explain":"Tool descriptions are the primary mechanism LLMs use for tool selection, and near-identical descriptions cause misrouting between similar tools; the guide prescribes differentiating each tool's purpose, inputs, outputs, and when to use it versus alternatives. Forcing tool_choice per request is brittle scaffolding that does not fix selection for the general conversation flow, and merging the tools makes the overlap worse, not better."},{"domain":2,"scenario":"In a multi-agent research system, an extraction subagent must always run one of its extraction tools before producing any output for the coordinator. Occasionally it instead returns conversational text such as \"I would extract the entities now,\" which the coordinator cannot consume.","question":"How should tool_choice be configured for this step?","options":["Set tool_choice to \"auto\" and add a system prompt reminder to always extract before replying","Set tool_choice to \"any\" so the model is guaranteed to call a tool rather than return conversational text","Set tool_choice to {\"type\": \"tool\", \"name\": \"extract_entities\"} to pin the exact tool for the step","Leave tool_choice unset; with good descriptions the model will call tools reliably"],"answer":[1],"explain":"The guide defines tool_choice \"any\" as the way to guarantee the model calls a tool rather than returning conversational text, which matches the requirement that any extraction tool run before output. Forced selection of one named tool over-constrains the step when any of several extraction tools is acceptable, and \"auto\" explicitly permits the text-only replies being observed."},{"domain":2,"scenario":"A support agent's process_refund tool rejects a $480 refund because policy caps refunds at $200. Today the tool returns {\"error\": \"Operation failed\", \"isError\": true}. The model reacts by retrying the refund twice, then apologizing without explaining the real reason to the customer.","question":"How should the tool's response be redesigned?","options":["Keep {\"error\": \"Operation failed\", \"isError\": true} and let the agent decide whether to escalate","Return isError: true with errorCategory \"transient\" and isRetryable: true so the agent retries after a short backoff","Return isError: false with the policy limit embedded in the payload so the model infers the rejection itself","Return isError: true with errorCategory \"business\", isRetryable: false, and a customer-friendly explanation that the amount exceeds the refund policy cap"],"answer":[3],"explain":"Business rule violations are non-retryable by nature; the guide calls for retriable: false flags plus customer-friendly explanations so the agent can communicate appropriately instead of retrying or guessing. The generic \"Operation failed\" is exactly the uniform error response the guide warns prevents appropriate recovery decisions, and marking a deterministic policy limit as transient/retryable wastes attempts."},{"domain":2,"scenario":"A platform team wants every Claude Code user in a repository to get the same GitHub MCP server for issue triage, authenticated with a token each developer already holds locally.","question":"Which TWO configuration practices match the guide?","options":["Define the server in the project-root .mcp.json so every teammate discovers it on connection","Reference the credential as ${GITHUB_TOKEN} so the token expands from each developer's environment without being committed","Add the server to each developer's ~/.claude.json, since that file is the shared team configuration location","Commit a personal access token literal in .mcp.json so the server authenticates out of the box for everyone"],"answer":[0,1],"explain":"Project-scoped .mcp.json is the guide's mechanism for shared team tooling, and environment variable expansion like ${GITHUB_TOKEN} provides credential management without committing secrets. ~/.claude.json is explicitly the personal/experimental scope, and a literal committed token violates the secrets guidance."},{"domain":2,"scenario":"A research system's web subagent searches for recent papers on a narrow topic. The query executes successfully against the index but returns no matching documents. The agent marks the step as failed, retries three times, and finally escalates to the coordinator as an outage.","question":"How should the search tool handle this outcome?","options":["Return isError: true with errorCategory \"transient\" so the coordinator can retry the search","Return a successful result containing zero matches, since the query executed correctly and simply found nothing","Return isError: true with errorCategory \"validation\" because the inputs matched no records","Return the closest loosely-related papers to avoid signaling an empty result"],"answer":[1],"explain":"The guide distinguishes access failures, which need retry decisions, from valid empty results representing successful queries with no matches; a clean zero-match result is a success, not an error. Labeling it transient burns retries on a deterministic outcome, and labeling it validation falsely tells the agent its input was malformed."},{"domain":2,"scenario":"A document-analysis agent exposes one generic analyze_document tool that the team uses for three different jobs: pulling structured data points, writing summaries, and checking claims against sources. The model frequently applies the wrong behavior for a given request, and reviewers cannot predict which mode it will choose.","question":"What redesign does the guide recommend here?","options":["Keep a single tool but add a mode parameter (\"extract\" | \"summarize\" | \"verify\") documented in one long description","Rename it to process_document with a description listing all three responsibilities in detail","Split it into purpose-specific tools — extract_data_points, summarize_content, and verify_claim_against_source — each with a defined input/output contract","Keep the tool as-is and force the correct invocation per request with tool_choice"],"answer":[2],"explain":"The guide's remedy for an overloaded generic tool is splitting it into purpose-specific tools with defined input/output contracts, using exactly this analyze_document example. A mode parameter or a longer description leaves one overloaded surface the model must still disambiguate, and per-request tool_choice forcing is brittle scaffolding around a design flaw."},{"domain":2,"scenario":"In a multi-agent research system, the synthesis subagent occasionally needs quick fact checks on findings. When the team granted it the full web search tool, it drifted into conducting its own research instead of synthesizing; when they granted no tools, verification requests piled up at the coordinator for trivial checks.","question":"What tool design best fits the synthesis agent?","options":["Retain full web search access but add a system prompt rule forbidding the synthesis agent from doing research","Give every subagent the same shared tool set so the coordinator can delegate any task to any agent","Remove all tools from the synthesis agent so it can only work with findings provided by the coordinator","Give it a narrowly scoped verify_fact tool for high-frequency checks and route complex research cases through the coordinator"],"answer":[3],"explain":"The guide prescribes scoped tool access with limited cross-role tools for specific high-frequency needs, naming a verify_fact tool for a synthesis agent as the example, while routing complex cases through the coordinator. A prompt rule is weaker than scope for preventing cross-specialization misuse, and the no-tools and same-tools-everywhere options reintroduce the pileup and the degraded selection (18 tools versus 4-5) the guide warns about."},{"domain":2,"scenario":"A support platform team is standardizing how its MCP tools report failures. Today every failure path returns the same shapeless message, and agents respond to permission denials, malformed inputs, and upstream timeouts in identical, mostly wrong ways.","question":"Which THREE elements belong in the structured error responses?","options":["An isRetryable boolean paired with a human-readable description of what went wrong","The tool's complete server-side stack trace, plus a standing instruction to retry every failed call up to three times","An isError flag signaling that the tool call failed","An errorCategory field distinguishing transient, validation, and permission failures"],"answer":[0,2,3],"explain":"The guide's structured error pattern combines the isError flag, an errorCategory of transient/validation/permission, and an isRetryable boolean with human-readable descriptions so the agent can choose the right recovery path. Blanket retry instructions are precisely what structured metadata exists to prevent, since they waste attempts on non-retryable validation and permission errors."},{"domain":2,"scenario":"A dev-productivity agent misroutes \"analyze this page\" requests to analyze_notes instead of the newly renamed extract_web_results. The team rewrote both tool descriptions twice with no improvement. An audit then reveals the system prompt contains: \"Whenever the user says analyze, use the analyze tool.\"","question":"What is the actual fix?","options":["Rename analyze_notes again so no tool name in the server contains the word \"analyze\"","Revise the system prompt to remove the keyword-sensitive instruction, since prompt wording can override even well-written tool descriptions","Set tool_choice to forced {\"type\": \"tool\", \"name\": \"extract_web_results\"} on every request","Merge extract_web_results and analyze_notes back into one tool so the prompt instruction no longer creates ambiguity"],"answer":[1],"explain":"The guide explicitly warns that keyword-sensitive system prompt wording creates unintended tool associations and can override well-written descriptions; since the descriptions were already fixed and the misrouting persists, the residual cause is the prompt rule. Renaming again treats a symptom while leaving the override in place, and forced selection on every request breaks all other tool flows."},{"domain":2,"scenario":"A team is wiring Claude Code into its Jira-based sprint workflow. Agents currently prefer the built-in Grep tool over the far more capable Jira MCP search tool, and they burn many exploratory tool calls just discovering which issues and documents exist before doing useful work.","question":"Which THREE changes align with the guide?","options":["Expose the issue and documentation catalog as MCP resources so agents see available data without exploratory tool calls","Configure the Jira server at user level in ~/.claude.json so all team members share it through personal config","Enhance the Jira MCP tool descriptions to detail capabilities and outputs so the agent prefers them over built-in tools like Grep","Adopt an existing community Jira MCP server rather than building a custom one, reserving custom servers for team-specific workflows"],"answer":[0,2,3],"explain":"All three practices come straight from the guide: content catalogs exposed as MCP resources reduce exploratory tool calls, detailed MCP tool descriptions prevent the agent from preferring built-ins like Grep, and community servers are preferred over custom builds for standard integrations such as Jira. ~/.claude.json is the personal/experimental scope — shared team tooling belongs in project-level .mcp.json."},{"domain":3,"scenario":"A senior engineer has documented the team's API conventions in her own ~/.claude/CLAUDE.md. A new teammate joins the repository and reports that Claude Code is not following the team's API conventions at all, even though the repo is cloned with all project files intact.","question":"What should the architect do to make the conventions apply to every developer on the team?","options":["Move the conventions into the project-level .claude/CLAUDE.md and commit it to version control","Copy the conventions into a CLAUDE.md file in every subdirectory of the repository","Have each teammate manually recreate the conventions in their own ~/.claude/CLAUDE.md","Add an @import line in the new teammate's ~/.claude/CLAUDE.md pointing at the senior engineer's home directory file"],"answer":[0],"explain":"User-level CLAUDE.md instructions apply only to that user and are not shared with teammates through version control, which is exactly why the new hire sees no conventions; project-level .claude/CLAUDE.md is version-controlled and loads for everyone. Directory-level copies add duplication for a repo-wide concern, and per-user copies or imports into personal files keep the source of truth outside the shared repository."},{"domain":3,"scenario":"An architect is triaging the team's backlog of Claude Code tasks for the sprint. The tasks include: (a) restructuring the monolith into microservices, (b) adding a date validation conditional to one function, (c) a library migration affecting 45+ files, and (d) a single-file bug fix with a clear stack trace.","question":"Which TWO tasks should be routed to plan mode rather than direct execution?","options":["The microservice restructuring","The date validation conditional","The library migration affecting 45+ files","The single-file bug fix with a clear stack trace"],"answer":[0,2],"explain":"Plan mode is designed for complex tasks with large-scale changes, multiple valid approaches, architectural decisions, and multi-file modifications — both the restructuring and the 45+ file migration fit. Direct execution is appropriate for simple, well-scoped changes like a single validation check or a one-file fix with a clear stack trace, so using plan mode there adds overhead without benefit."},{"domain":3,"scenario":"A team's React testing conventions must apply to every *.test.tsx file, but those files are colocated with source code in dozens of directories across the repo. The team currently maintains copies of the conventions in a CLAUDE.md inside each test directory, and the copies have drifted out of sync while missing some colocated tests entirely.","question":"Which configuration correctly applies the conventions to all test files regardless of directory location?","options":["A single .claude/rules/testing.md file with YAML frontmatter paths: [\"**/*.test.tsx\"]","Keep the per-directory CLAUDE.md approach but add the missing directories","Put the testing conventions in the root CLAUDE.md so they are always loaded","Create a testing skill with context: fork that developers invoke before writing tests"],"answer":[0],"explain":"Glob-pattern rules in .claude/rules/ load only when editing matching files and are explicitly the advantage over directory-level CLAUDE.md for conventions spanning multiple directories, ending the duplication and drift. Root CLAUDE.md loads the conventions into every session even when no test file is touched, wasting context and tokens, and a skill is for on-demand task workflows, not standing file-editing conventions."},{"domain":3,"scenario":"A team's codebase-analysis skill works well, but when it runs it floods the main conversation with thousands of lines of verbose discovery output. Engineers complain that afterwards their sessions lose track of the original task they were working on.","question":"What should the architect configure in the skill's SKILL.md frontmatter?","options":["context: fork, so the skill runs in an isolated sub-agent context and its output does not pollute the main conversation","allowed-tools restricted to read-only tools so the skill cannot modify files","argument-hint so developers are prompted for the analysis target when they invoke the skill without arguments","Move the skill to ~/.claude/skills/ under a different name so teammates are unaffected"],"answer":[0],"explain":"The context: fork frontmatter option runs a skill in an isolated sub-agent context, specifically preventing verbose skill outputs like codebase analysis from polluting the main conversation. allowed-tools restricts which tools the skill may call but does nothing about output volume, argument-hint addresses missing parameters, and a personal ~/.claude/skills/ variant only avoids affecting teammates — the pollution would persist for the individual."},{"domain":3,"scenario":"A CI pipeline runs automated Claude Code code reviews on every pull request and posts findings as inline PR comments. The first runs hung waiting for terminal input, findings could not be parsed by the commenting bot, and after a new commit the review re-posted every previously reported issue as a duplicate.","question":"Which THREE changes together fix the pipeline?","options":["Run Claude Code with the -p (print) flag so it executes non-interactively and never waits for input","Use --output-format json together with --json-schema so findings come back as machine-parseable structured output","Include prior review findings in context and instruct Claude to report only new or still-unaddressed issues","Reuse the same interactive Claude session that generated the code to also review its own changes"],"answer":[0,1,2],"explain":"The guide names all three as the CI integration pattern: -p prevents interactive input hangs, --output-format json with --json-schema enforces structured output for automated posting as inline comments, and feeding back prior findings with instructions to report only new or unaddressed issues avoids duplicate comments. Reusing the generating session is the opposite of the guide's guidance — an independent review instance reviews changes more effectively than the session that wrote them."},{"domain":3,"scenario":"A monorepo's root CLAUDE.md has grown to thousands of lines because it embeds every package's standards — mobile UI conventions, backend API rules, infrastructure guidelines. Teams complain Claude loads large amounts of irrelevant context, and the maintainer knows precisely which standards each package actually needs.","question":"How should the architect reorganize the configuration?","options":["Split the standards into separate files and use @import in each package's CLAUDE.md to selectively include only the standards files relevant to that package","Move all the standards into .claude/rules/ files with no path frontmatter so they are organized by topic","Keep the single root CLAUDE.md and trust Claude to ignore conventions irrelevant to the current package","Move the standards into ~/.claude/CLAUDE.md so each developer curates their own copy"],"answer":[0],"explain":"The @import syntax exists to keep CLAUDE.md modular by referencing external files, letting each package's CLAUDE.md import only the specific standards files relevant to it based on maintainer knowledge — directly cutting the irrelevant context. Rules files without path scoping still load globally and do not express per-package selection, and relying on the model to ignore loaded text or moving standards to unshared user-level files both fail the goal."},{"domain":3,"scenario":"A platform team must expose two things to Claude Code: (1) universal coding standards that should shape every single session in the repository, and (2) a release-checklist workflow that engineers should run only when cutting a release. Both are currently buried in a 500-line CLAUDE.md, and engineers report the release steps are easy to lose among the standards.","question":"How should the architect distribute this content?","options":["Keep the universal standards in CLAUDE.md as always-loaded content, and expose the release workflow as an on-demand skill","Move both the standards and the release workflow into skills so nothing is loaded until invoked","Keep both in CLAUDE.md but move the release checklist to the top of the file","Make the standards a skill that engineers invoke at session start, and keep the release checklist in CLAUDE.md"],"answer":[0],"explain":"The guide's decision rule: CLAUDE.md is for always-loaded universal standards, while skills are for task-specific workflows invoked on demand — exactly matching the split between the coding standards and the release checklist. Making the standards a skill (or burying the checklist in always-loaded memory) inverts the rule: standards must shape every session without invocation, and the checklist only matters during releases."},{"domain":3,"scenario":"A team wrote a prose specification describing how a legacy field format should be transformed into the new schema. Across several attempts, Claude interprets the prose differently each time, producing inconsistent transformations — the wording seems unambiguous to the authors but is not to the model.","question":"What is the architect's best next step to make the expected transformation consistent?","options":["Provide 2-3 concrete input/output examples showing the legacy format and the exact expected result","Write a full test suite covering the transformation first and iterate by sharing test failures with Claude","Use the interview pattern and have Claude ask questions until every ambiguity in the prose is resolved","Rewrite the prose specification with more precise wording and stricter terminology"],"answer":[0],"explain":"The guide states concrete input/output examples are the most effective way to communicate expected transformations precisely when prose descriptions are interpreted inconsistently — this scenario is the textbook trigger. Test-driven iteration is a strong pattern, but it is the heavier machinery for guiding progressive improvement on known behavior; here the immediate failure is communicating the expected transformation itself, which examples fix directly and another prose rewrite would not."},{"domain":3,"scenario":"A team is building a skill that scaffolds database migration scripts. Two requirements: when a developer invokes it without arguments, they must be prompted for the target schema version; and while the skill runs, it must not be able to perform destructive actions outside writing the migration files. The team also debates adding context: fork and shipping the skill under a personal name in ~/.claude/skills/.","question":"Which TWO frontmatter choices satisfy the two stated requirements?","options":["argument-hint, to prompt the developer for the required parameter when the skill is invoked without arguments","allowed-tools restricted to file write operations, to prevent destructive actions during skill execution","context: fork, so the scaffolding runs in an isolated sub-agent context","Ship it in ~/.claude/skills/ under a different name so teammates are unaffected"],"answer":[0,1],"explain":"The guide maps each frontmatter field to exactly these purposes: argument-hint prompts developers for required parameters when invoking without arguments, and allowed-tools restricts tool access during execution such as limiting to file writes to prevent destructive actions. context: fork isolates output from the main conversation — a real feature, but unrelated to either stated requirement — and a personal ~/.claude/skills/ variant is the mechanism for individual customization, which defeats a team tool."},{"domain":3,"scenario":"A CI job generates refactoring code with Claude Code, and to save setup cost an engineer proposes letting the same session immediately review its own diff since it already holds all the context about the changes. Early trials show the self-reviews repeatedly miss issues that human reviewers catch.","question":"How should the architect design the review stage?","options":["Run an independent Claude Code instance for review, with CLAUDE.md supplying the project context and review criteria it needs","Keep the single session but instruct it to be more critical when reviewing its own changes","Reuse the session and pipe its output through --output-format json with --json-schema so the review is more rigorous","Run the review in the same session only after the code generation phase has fully completed"],"answer":[0],"explain":"The guide is explicit on session context isolation: the same session that generated code is less effective at reviewing its own changes than an independent review instance, so review must run in a separate invocation — with CLAUDE.md as the mechanism that provides the project context (testing standards, review criteria) the fresh instance lacks. Prompting the existing session to be self-critical or structuring its output does not remove the shared-context bias; the problem is the session, not the format."},{"domain":4,"scenario":"A CI pipeline runs automated Claude-based code review on every pull request. Developers complain that the reviewer flags minor style issues and common local patterns as 'potential bugs', and they have started ignoring all findings, including the accurate security ones. The current system prompt says 'check that comments are accurate' and 'be conservative'.","question":"What is the most effective change the architect should make to improve precision?","options":["Strengthen the confidence language: instruct the model to 'only report high-confidence findings' and 'be very conservative'","Replace the vague instructions with categorical criteria that define which issues to report (bugs, security issues where claimed behavior contradicts actual code behavior) and which to skip (minor style, local patterns)","Lower the model temperature so fewer spurious findings are generated randomly","Keep reporting everything and add a downstream filter that hides findings developers previously dismissed"],"answer":[1],"explain":"The guide states that general instructions like 'be conservative' or 'only report high-confidence findings' fail to improve precision compared to specific categorical criteria that define what to report versus what to skip. Option 0 is the best distractor because it sounds aligned with the goal, but confidence-based filtering is explicitly called out as ineffective relative to defining concrete report/skip categories. High false positive rates also undermine developer trust in the accurate categories, which is the problem being fixed."},{"domain":4,"scenario":"A document processing system extracts structured data from incoming documents that can be invoices, receipts, or contracts. The architect defined three extraction tools with different JSON schemas. With tool_choice set to \"auto\", some responses came back as free-form prose instead of tool calls, breaking the downstream parser. The document type is not known before processing.","question":"How should the architect configure tool_choice to guarantee schema-compliant structured output?","options":["Keep tool_choice: \"auto\" but add a system prompt instruction to always respond with JSON","Force a single tool with tool_choice: {\"type\": \"tool\", \"name\": \"extract_invoice\"} for every document","Set tool_choice: \"any\" so the model must call one of the three extraction tools but can choose which based on the document","Remove the tools and request raw JSON in the message body, then parse it with a tolerant JSON parser"],"answer":[2],"explain":"The guide specifies tool_choice: \"any\" guarantees the model calls a tool (but lets it pick which) — exactly right when multiple extraction schemas exist and the document type is unknown. Option 0 is the best distractor because \"auto\" explicitly permits the model to return text instead of calling a tool, which is the observed failure; a prompt instruction does not guarantee it. Option 1 wrongly pins all documents to one schema."},{"domain":4,"scenario":"A platform team wants to cut Claude API spend by 50% using the Message Batches API. Their workload has two parts: blocking pre-merge code review checks that gate Pull Requests, and a weekly compliance audit of merged code. An engineer proposes moving both to the batch API to maximize savings.","question":"Which API assignment is correct for these two workflows?","options":["Synchronous Messages API for the pre-merge checks; Message Batches API for the weekly audit","Message Batches API for both workflows, since the 50% savings applies to all request types","Message Batches API for both, with the pre-merge batch flagged as urgent for priority processing","Synchronous API for both, batching only the audit results after collection"],"answer":[0],"explain":"The guide is explicit that batch processing suits non-blocking, latency-tolerant workloads (overnight reports, weekly audits) and is inappropriate for blocking workflows like pre-merge checks — batches have up to a 24-hour window with no guaranteed latency SLA, and there is no priority flag. Option 1 is the best distractor because the cost saving is real, but cost does not override the latency requirement of a gate that developers wait on."},{"domain":4,"scenario":"An invoice extraction pipeline validates tool_use output against a strict JSON schema. Every field parses cleanly, but validation finds the extracted line items do not sum to the extracted stated total on several invoices. Re-running the same extraction with the error appended to the prompt sometimes 'fixes' the sum by altering individual line item values.","question":"What should the architect do about invoices where extracted values are individually well-formed but mutually inconsistent?","options":["Remove the sum check from validation so these invoices stop failing","Keep retrying with error feedback appended until the line items sum to the stated total","Make line_items optional in the schema so inconsistent invoices still validate","Extract a calculated_total alongside stated_total, add a conflict_detected boolean, and surface the discrepancy instead of silently reconciling it"],"answer":[3],"explain":"The guide's self-correction design pattern says to extract calculated_total next to stated_total and add conflict_detected booleans for inconsistent source data — the discrepancy originates in the document, not the extraction. Option 1 is the best distractor because retry-with-error-feedback is a legitimate technique, but retries are for format and structural output errors; here the retry 'fixes' the sum by fabricating values, corrupting the data. Options 0 and 2 hide the problem rather than flag it."},{"domain":4,"scenario":"A code generation service produces refactoring patches, and the same Claude session that generated a patch is asked to review it with the instruction 'carefully review the code you just wrote for subtle bugs'. Despite enabling extended thinking for the review step, subtle logic errors keep reaching production.","question":"Which review design addresses the root cause?","options":["Keep the same session but escalate: enable extended thinking and strengthen the self-review instructions","Run a second, independent Claude instance to review the generated code without the generator's reasoning context","Add few-shot examples of previously missed bugs to the generator's prompt so it avoids them during generation","Have the generator re-emit the code with its review comments inlined so reviewers can see both together"],"answer":[1],"explain":"The guide states a model retains its reasoning context from generation, making it less likely to question its own decisions in the same session, and that independent review instances without prior reasoning context are more effective than self-review instructions or extended thinking. Option 0 is the best distractor because extended thinking is a real capability — but the guide explicitly ranks it below independent instances for this failure mode. The problem is context contamination, not reasoning depth."},{"domain":4,"scenario":"A nightly reporting job is being moved to the Message Batches API for the 50% cost savings. The workflow requires the model to call a database lookup tool mid-request, receive the tool result, and continue generating the report using those results. The team plans to submit this as a single batch request that includes the tool definition and expects the batch to execute the tool and feed results back.","question":"What is the flaw in this design?","options":["It will work only if a custom_id is attached to the request so tool results can be correlated","Tool definitions cannot be included in batch requests at all, so the tools must be described in the system prompt as JSON examples","The Message Batches API does not support multi-turn tool calling within a single request — it cannot execute tools mid-request and return results, so the workflow must be restructured","The design is fine; the batch simply delays tool result availability by up to 24 hours before continuing"],"answer":[2],"explain":"The guide states the batch API does not support multi-turn tool calling within a single request — it cannot execute tools mid-request and return results. The agentic portion must be restructured: fetch the lookup data before submitting the batch, or run that step on the synchronous API. Options 0 and 3 are misconceptions that treat the limitation as a correlation or latency issue, when it is a hard capability boundary."},{"domain":4,"scenario":"A team ships a structured extraction service using tool_use with a strict JSON schema. In the design review, the lead says: 'We enforce the schema through tool use, so the output is guaranteed correct — we can skip downstream validation.' In the first demo, an extracted invoice parses perfectly but has the currency code placed in the vendor_name field, and line items whose amounts do not sum to the stated total.","question":"What does the strict schema via tool use actually guarantee, and what is missing?","options":["It guarantees full correctness — the model sees the schema, so values land in the right fields and totals reconcile by construction","It guarantees schema compliance and eliminates JSON syntax errors, but not semantic errors — wrong-field values and inconsistent sums require a separate semantic validation step with retry-with-error-feedback for structural mistakes","It guarantees semantic correctness only when every field is marked required in the schema","It guarantees neither syntax nor semantics; tool use is a formatting convention and JSON parsing can still fail"],"answer":[1],"explain":"The guide draws the exact line: strict JSON schemas via tool use eliminate syntax errors but do not prevent semantic errors such as values in wrong fields or line items that do not sum to the total. Option 0 is the best distractor because it is the lead's actual claim — schema visibility constrains shape, not meaning. Semantic validation (e.g., sum checks, field-plausibility checks) remains a required layer, with retries effective for format and structural errors."},{"domain":4,"scenario":"A code review prompt produces inconsistent output on ambiguous cases: sometimes it flags a defensive null-check as dead code, sometimes not, and findings appear in varying formats. The architect has collected real ambiguous examples and wants to use few-shot prompting. Each finding should render as location, issue, severity, suggested fix.","question":"Which THREE few-shot practices follow the guide?","options":["Write 2-4 targeted examples of ambiguous cases, each showing the reasoning for why one action was chosen over plausible alternatives","Include examples that demonstrate the exact desired output format: location, issue, severity, suggested fix","Include examples that distinguish acceptable local code patterns from genuine issues","Build an exhaustive catalog of 25+ examples covering every known code pattern so the model matches the closest pre-specified case"],"answer":[0,1,2],"explain":"The guide prescribes 2-4 targeted few-shot examples for ambiguous scenarios showing why one action was chosen over plausible alternatives, examples demonstrating the desired output format for consistency, and examples distinguishing acceptable patterns from genuine issues to reduce false positives. Option 3 is the best distractor because more examples seems safer, but the guide's point is that few-shot examples enable the model to generalize judgment to novel patterns — an exhaustive case-matching catalog works against that and is not the recommended scale."},{"domain":4,"scenario":"An extraction system processes supplier contracts that vary widely: many contracts have no amendment date, the category taxonomy keeps growing beyond the current enum, and dates arrive as '2024-03-01', 'March 1, 2024', and '01/03/2024'. The current schema marks every field required, and the model invents amendment dates on contracts that lack them.","question":"Which THREE schema and prompt design changes follow the guide?","options":["Keep amendment_date required but add a prompt instruction to never invent values","Make amendment_date optional (nullable), since source documents may not contain the information","Extend the category enum with an \"other\" value paired with a free-text detail field for extensible categorization","Add format normalization rules to the prompt alongside the strict output schema to handle inconsistent source date formats"],"answer":[1,2,3],"explain":"The guide prescribes designing fields as optional (nullable) when source documents may not contain the information — this prevents the model from fabricating values to satisfy required fields — plus enum \"other\" + detail string patterns for extensible categories, and format normalization rules in the prompt alongside strict schemas for inconsistent source formatting. Option 0 is the best distractor because it acknowledges the fabrication problem but keeps the structural pressure (required field) that causes it; an instruction cannot reliably override a hard schema constraint."},{"domain":4,"scenario":"A nightly job batch-processes 200,000 contracts through the Message Batches API, with a business SLA of 30 hours from document receipt to delivered extraction. The team is deciding submission cadence, failure handling, and rollout strategy.","question":"Which THREE design decisions are correct per the guide?","options":["Attach a custom_id to every request so responses correlate to inputs, and on failure resubmit only the failed documents — with fixes such as chunking documents that exceeded context limits","Resubmit the entire 200,000-document batch after any failure to keep the dataset consistent","Submit batches at intervals of 4 hours or less, so the worst case (submission gap plus the 24-hour batch processing window) stays within the 30-hour SLA","Refine the prompts on a representative sample set before batch-processing the full volume, to maximize first-pass success and avoid iterative resubmission costs"],"answer":[0,2,3],"explain":"The guide covers all three: custom_id fields correlate batch request/response pairs and enable resubmitting only failed documents with appropriate modifications like chunking; a 4-hour submission window guarantees a 30-hour SLA against the 24-hour batch processing window (4 + 24 = 28 hours worst case); and prompt refinement on a sample set first maximizes first-pass success rates. Option 1 is the best distractor because consistency sounds principled, but resubmitting everything re-pays full cost for documents that already succeeded — the guide's pattern is targeted resubmission by custom_id."},{"domain":5,"scenario":"A customer support resolution agent handles a refund request. Its lookup_order tool returns 40+ fields per query, but only the order ID, status, purchase date, and amount are relevant to the refund decision. Hours into a multi-issue session, earlier lookups have filled the context window.","question":"Which context management design is correct?","options":["Truncate verbose tool outputs to only the return-relevant fields before they accumulate in context","Include the full 40-field tool output so the model can reinterpret fields if the issue changes","Apply progressive summarization to condense each tool output into a one-sentence summary","Increase the context window size so all raw tool outputs fit"],"answer":[0],"explain":"The guide calls for trimming verbose tool outputs to only relevant fields before they accumulate, since 40+ fields consume tokens disproportionately to their relevance. Summarization is the trap: progressive summarization risks condensing amounts, dates, and statuses into vague summaries, losing the transactional facts."},{"domain":5,"scenario":"A customer opens a support session and immediately says: \"I've been through three bots already — just put me through to a human.\" The issue appears to be a simple address change the agent could complete in one step.","question":"How should the escalation logic be designed for this case?","options":["Acknowledge frustration, offer to resolve since it is straightforward, and escalate only if the customer reiterates","Honor the explicit request for a human immediately without first attempting investigation","Attempt automated resolution silently, then escalate if the customer complains again","Route to escalation only after checking the case against sentiment thresholds"],"answer":[1],"explain":"The guide draws a sharp distinction: explicit demands for a human are honored immediately without first attempting investigation. Option A is the correct pattern only when the customer has NOT explicitly demanded escalation — the agent acknowledges frustration, offers resolution, and escalates only if the customer reiterates. Sentiment thresholds are unreliable proxies for case complexity."},{"domain":5,"scenario":"In a multi-agent research system, the document-analysis subagent hits a timeout partway through scanning a corpus. It has partial findings for 3 of 7 requested topics and knows a secondary archive could cover the remainder.","question":"What should the subagent return to the coordinator?","options":["A generic \"search unavailable\" status so the coordinator treats it as a clean failure","Empty results for all 7 topics so partially-completed topics are not over-trusted","Structured error context: failure type, what was attempted, partial results, and the alternative approach","Retry internally up to a fixed retry ceiling, and if it still fails, return empty results as success"],"answer":[2],"explain":"Structured error context — failure type, attempted query, partial results, alternatives — is what enables intelligent coordinator recovery decisions. Generic statuses like \"search unavailable\" hide exactly the context the coordinator needs, and silently suppressing errors by returning empty results as success is a named anti-pattern."},{"domain":5,"scenario":"An agent exploring a legacy codebase has been running for an extended session. It now answers follow-up questions inconsistently, referring to \"typical patterns\" instead of the specific classes it discovered in hour one.","question":"Which countermeasure most directly addresses this degradation?","options":["Maintain a scratchpad file of key findings and reference it for subsequent questions","Run /compact to shrink the context that has filled with verbose discovery output","Restart the session from scratch whenever answers become inconsistent","Instruct the model via system prompt to pay closer attention to earlier findings"],"answer":[0],"explain":"Scratchpad files exist specifically to persist key findings across context boundaries and counteract degradation — inconsistent answers citing \"typical patterns\" instead of earlier discoveries is the guide's named symptom. /compact is the near-miss: it reduces context usage when verbose discovery output fills the window, but it does not persist findings for reliable later recall; prompt exhortations and restarts address neither mechanism."},{"domain":5,"scenario":"A structured data extraction system reports 97% overall field accuracy, so the team plans to cut human review across the board. A spot check later reveals one document type extracts at 72% on a critical amount field.","question":"Which TWO practices would have surfaced this before the review cut?","options":["Analyzing accuracy by document type and field to verify consistent performance across all segments","Stratified random sampling of high-confidence extractions for ongoing error rate measurement","Raising the model's self-reported confidence threshold so fewer borderline extractions ship","Re-running the full validation set until the aggregate metric stabilizes above 98%"],"answer":[0,1],"explain":"Aggregate metrics like 97% can mask poor performance on specific document types or fields, so the guide requires segment-level analysis before reducing review, plus stratified random sampling of high-confidence extractions to detect novel error patterns. Self-reported confidence scores are explicitly called out as unreliable proxies, and re-rolling validation until a better aggregate is just metric gaming that still hides segment gaps."},{"domain":5,"scenario":"A coordinator fans research questions out to web-search and document subagents. One subagent's API call fails with a transient network error; another completes successfully but legitimately finds zero matching sources for its topic.","question":"Which TWO error-handling designs are correct?","options":["The transient-failure subagent implements local recovery (retry) and only propagates what it cannot resolve","The empty-result subagent reports a successful query with no matches, distinct from an access failure","Both subagents propagate errors immediately to the coordinator without local recovery","Both subagents report success with empty results to keep the workflow running"],"answer":[0,1],"explain":"The guide requires subagents to handle transient failures with local recovery and propagate only unresolvable errors, and to distinguish access failures (needing retry decisions) from valid empty results (successful queries with no matches). Immediate propagation of every error and suppressing errors as empty successes are both named anti-patterns — the latter in particular robs the coordinator of the chance to retry or reroute."},{"domain":5,"scenario":"A support agent's lookup_customer tool returns three customer records matching \"J. Okafor\" at the same city, each with a different open order. The customer asked about a refund but never gave an account number.","question":"What should the agent do?","options":["Pick the record with the most recent order, since refund questions usually concern recent purchases","Ask the customer for an additional identifier to disambiguate before proceeding","Escalate to a human, since three-way ambiguity exceeds the agent's resolution authority","Process the refund against all three records and reverse the incorrect ones"],"answer":[1],"explain":"The guide states multiple results require clarification (requesting additional identifiers) rather than heuristic selection. Picking the most recent (A) or acting on all (D) are heuristic choices the guide forbids; escalation (C) misclassifies a resolvable ambiguity as a policy gap."},{"domain":5,"scenario":"A customer asks a support agent to price-match a competitor's advertised price. The written policy covers price adjustments on the company's own site but says nothing about competitor matching. The agent's tooling could technically process the adjustment.","question":"How should the escalation criteria classify this case?","options":["Resolve autonomously, because the agent's tools are technically capable of the adjustment","Resolve autonomously with a conservative interpretation, extending the own-site policy to competitor prices","Escalate, because the policy is ambiguous or silent on the customer's specific request","Escalate, because price-matching is inherently a complex financial case"],"answer":[2],"explain":"The guide names policy exceptions and policy gaps — not merely complex cases — as escalation triggers, using competitor price matching when policy only addresses own-site adjustments as its example. Tool capability (A) does not confer policy authority, and inventing a policy extension (B) is precisely the gap-filling that must go to a human. Complexity-based reasoning (D) mistakes the trigger: it is the policy silence, not the transaction's difficulty."},{"domain":5,"scenario":"A codebase-exploration coordinator runs multi-phase investigation with subagents. Previous sessions crashed mid-phase, forcing restarts from zero. The team also wants phase-two subagents to start with the right context rather than the coordinator's full verbose inventory.","question":"Which design combination is correct?","options":["Each agent exports structured state to a known location; on resume the coordinator loads the manifest and injects it into agent prompts","Each agent keeps findings only in conversation context, and the coordinator re-prompts subagents from the transcript after a crash","The coordinator periodically copies its entire context window to disk as the recovery artifact","Subagents checkpoint raw tool outputs so the coordinator can replay them in full on resume"],"answer":[0],"explain":"The guide's crash-recovery design is structured state exports: each agent writes state to a known location and the coordinator loads that manifest on resume and injects it into agent prompts. Transcript-based recovery (B) assumes the conversation context survived the crash, which is precisely what is lost; raw-context or raw-output dumps (C, D) restore verbosity without the distilled findings and re-create the accumulation problem recovery should avoid."},{"domain":5,"scenario":"A research synthesis agent merges two subagents' findings on market size: one credible source says $4.2B (2023 survey data), another says $5.1B (2025 published report). The final report must preserve provenance.","question":"Which three handling rules should the synthesis design enforce?","options":["Annotate the conflicting values with source attribution rather than arbitrarily selecting one","Require publication or data-collection dates in subagent structured outputs to enable correct temporal interpretation","Preserve claim-source mappings (URLs, document names, excerpts) through every synthesis step","Reconcile the values into a single averaged figure, citing both sources jointly"],"answer":[0,1,2],"explain":"The guide requires annotating conflicts with attribution rather than arbitrary selection, requiring dates so temporal differences are not misread as contradictions, and preserving structured claim-source mappings through synthesis — source attribution otherwise gets lost whenever findings are compressed. Averaging into one figure (D) fabricates a value no source supports and destroys the conflict information the coordinator needs."},{"domain":1,"scenario":"A coding agent built on the Claude Agent SDK is refactoring a large module. On one iteration the response arrives with stop_reason \"max_tokens\" and the assistant's message is cut off mid-sentence. The team's loop currently treats any stop_reason other than \"tool_use\" as completion.","question":"What is the correct way to handle this iteration?","options":["Treat stop_reason \"max_tokens\" as an explicit non-completion condition and handle it deliberately: raise the limit, compact context, or surface the failure.","Treat it as completion, since the model emitted its final answer before hitting the cap.","Silently retry the identical request in a loop until stop_reason is \"end_turn\", with no cap on retries.","Strip the truncated text from the conversation history and continue the loop as if the turn never happened."],"answer":[0],"explain":"max_tokens means output was truncated mid-generation, so treating it as end_turn silently ships incomplete work. The loop should branch explicitly on stop_reason and handle max_tokens deliberately: raise max_tokens, compact context, or surface the error. Unbounded silent retries hide a systematic problem and burn tokens, and deleting the truncated text throws away the model's partial reasoning."},{"domain":1,"scenario":"A platform team wants every coordinator in their multi-agent system to spawn a research subagent with the same system prompt, a restricted tool set, and a cheaper model, without each call site restating those details.","question":"How should the subagent be configured?","options":["Define the subagent once in an AgentDefinition (name, description, tools, model, prompt) and have coordinators invoke it by name through the Task tool.","Paste the full system prompt and tool whitelist into every Task prompt at each call site.","Give coordinators all tools and instruct them in CLAUDE.md to behave like the research subagent when needed.","Define the subagent's behavior in the project's .mcp.json so MCP servers enforce it."],"answer":[0],"explain":"AgentDefinition is the declarative way to pin a subagent's prompt, tool access, and model so every spawn is consistent and call sites stay minimal. Restating configuration in every Task prompt drifts over time, simulating a subagent inside the coordinator forfeits isolation and parallelism, and .mcp.json configures MCP servers, not agent definitions."},{"domain":1,"scenario":"An engineer has spent two hours in a Claude Code session getting a subtle concurrency bug diagnosed. Before attempting a risky fix, they want to preserve the exact current thread so they can later try a different fix from the same starting point.","question":"What should they do?","options":["Use fork_session to create an independent branch that copies the current context, leaving the original session untouched.","Note the session name and use --resume later, since resuming returns the session to its baseline state.","Start a fresh session and paste a written summary of the diagnosis into it.","Duplicate the project directory and run a second Claude Code instance from the copy."],"answer":[0],"explain":"fork_session copies the session's context into a new independent branch, so both fixes can be attempted from the same baseline. --resume continues the same thread rather than restoring it, so the baseline gets consumed. A fresh session with a summary loses tacit context, and duplicating the repository does not duplicate the session."},{"domain":1,"scenario":"In a hub-and-spoke research system, the coordinator forwards each subagent's findings to the next stage as free-form prose. The synthesis stage recently dropped citation sources and contradictory data points that the research stage had flagged.","question":"What change most directly fixes the handoff?","options":["Require subagents to return structured results (findings, sources, conflicts, open questions) and have the coordinator pass that structure to the next stage.","Route subagents directly to each other so nothing is lost in the coordinator's rewriting.","Instruct the coordinator to make its prose summaries longer and more detailed.","Have all subagents share one session so successors can read the full transcript."],"answer":[0],"explain":"Structured handoff contracts, with explicit fields for findings, sources, conflicts, and open questions, survive coordinator routing because downstream stages consume data instead of paraphrase. Direct subagent-to-subagent communication breaks the hub-and-spoke model's observability and error handling, longer prose is still lossy, and a shared transcript lets noise and stale intermediate state leak into downstream reasoning."},{"domain":1,"scenario":"A document-processing pipeline hardcodes a fixed chain: extract, classify, summarize. It performs well on standard invoices but fails on mixed packets containing contracts, receipts, and unrelated material, because every stage runs even when irrelevant.","question":"What is the strongest architectural fix?","options":["Let the orchestrating model adaptively decide which subtasks apply per input: classify first, then dynamically select and delegate only the needed subagents.","Keep the fixed chain but add a fifth stage that deletes irrelevant outputs afterward.","Replace the pipeline with a single monolithic prompt that handles every document type in one call.","Run all stages on every input but instruct each stage to output nothing when it is irrelevant."],"answer":[0],"explain":"Adaptive decomposition lets the model choose subtasks based on the input, which is exactly what varies here; a fixed prompt chain suits only uniform workloads. Post-hoc deletion keeps paying for irrelevant stages and can misfire, a monolithic prompt sacrifices the reliability and testability of decomposition, and output-nothing stages still burn tokens and add failure modes."},{"domain":2,"scenario":"An extraction service calls Claude with a submit_extraction tool. On sparse documents the model sometimes responds with prose saying no data was found instead of calling the tool, which breaks the service's parsing contract.","question":"What is the most reliable fix?","options":["Force the specific tool by setting tool_choice to that tool's name, so every response contains a submit_extraction call.","Set tool_choice to \"any\", guaranteeing that the model calls some tool.","Set tool_choice to \"auto\" and strengthen the system prompt's instruction to always call the tool.","Parse the prose responses for the phrase \"no data found\" and convert them into empty results."],"answer":[0],"explain":"Pinning tool_choice to a named tool guarantees that exact call, preserving the parsing contract even for sparse inputs; the schema can express emptiness with nullable fields. \"any\" forces a tool call but not necessarily the right one, \"auto\" plus prompt pressure stays probabilistic, and parsing prose for phrases is a named anti-pattern."},{"domain":3,"scenario":"A developer suspects stale instructions from an old CLAUDE.md are still affecting their sessions and wants to inspect and edit every memory file currently in play, across the hierarchy, without hunting through
