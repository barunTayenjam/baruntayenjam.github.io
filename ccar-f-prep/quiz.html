 directories.","question":"Which built-in command should they use?","options":["/memory","/compact","--resume <name>","@import"],"answer":[0],"explain":"/memory opens the memory files loaded into the current session across the CLAUDE.md hierarchy for direct inspection and editing, and is the recommended way to diagnose inconsistent or stale instructions. /compact summarizes conversation history, --resume <name> continues a past session, and @import pulls other files into a CLAUDE.md rather than showing what is loaded."},{"domain":3,"scenario":"An architect needs to understand how authentication flows through 14 services in a monorepo before drafting a migration plan. Running searches and reads in the main thread floods the conversation and degrades planning quality.","question":"What is the intended pattern?","options":["Use plan mode and delegate read-only investigation to an Explore subagent, which synthesizes findings and returns just the conclusions.","Continue in the main thread but prefix every search with an instruction not to remember the output.","Grant a subagent write tools so it can annotate the code while exploring.","Skip the investigation and draft the plan from the directory tree alone."],"answer":[0],"explain":"Plan mode pairs with a read-only Explore subagent so heavy investigation output stays out of the main thread; the subagent returns a synthesis the plan is drafted from, preserving context for the reasoning that matters. There is no do-not-remember prefix, write access during exploration risks unintended changes, and planning without reading the real code produces guesses."},{"domain":4,"scenario":"A structured-output pipeline keeps rejecting model responses because dates arrive as \"March 3rd\" instead of ISO 8601. The team currently retries with the identical prompt, and about a third of retries fail the same way.","question":"What is the recommended improvement to the retry loop?","options":["Feed validation failures back into the retry as structured feedback naming the pattern (for example detected_pattern: date_format) so the model corrects the class of error.","Keep identical retries but increase the retry count until an output happens to pass.","Post-process every field with regex normalization so validation never sees the problem.","Remove date validation, since the format difference is cosmetic."],"answer":[0],"explain":"Validation-retry loops work when the retry carries structured feedback about what failed and why; naming the pattern lets the model fix the whole class of error, not just this instance. Identical retries repeat the same mistake, silent regex post-processing masks the issue and grows brittle with each new field, and dropping validation trades correctness for convenience."},{"domain":4,"scenario":"A content moderation classifier built with two few-shot examples is consistent on clear violations but flips verdicts on borderline sarcasm cases, which make up a growing share of real traffic.","question":"What is the best few-shot response?","options":["Add a small set of two to four targeted borderline examples, covering both verdicts and showing the reasoning that separates them.","Expand to dozens of examples covering every past case so the model has full coverage.","Rewrite the criteria as longer, more emphatic prose instead of adding examples.","Lower the blocking threshold so borderline cases pass review automatically."],"answer":[0],"explain":"Few-shot prompting works by demonstration: a small targeted set that covers the ambiguous region, with both verdicts and the distinguishing reasoning, sharpens exactly where the model wavers. Dozens of examples add noise and dilute signal, longer prose criteria do not anchor judgment as well as worked cases, and loosening the threshold changes the product decision instead of model quality."}];
const DOMAINS = {
  1: ["D1", "Agentic Architecture & Orchestration", "27% of exam"],
  2: ["D2", "Tool Design & MCP Integration", "18% of exam"],
  3: ["D3", "Claude Code Configuration & Workflows", "20% of exam"],
  4: ["D4", "Prompt Engineering & Structured Output", "20% of exam"],
  5: ["D5", "Context Management & Reliability", "15% of exam"],
};
const app = document.getElementById("app");
const STATE_KEY = "ccarf_mock_state";
let Q = [], answers = [], sels = [], idx = 0, mode = null, picked = new Set(), timerId = null, flags = new Set(), deadline = 0;

function bestKey() {
  if (mode === "mock") return "ccarf_best_mock";
  if (mode === "missed") return "ccarf_best_missed";
  return "ccarf_best_d" + mode;
}
function getBest(k) { try { return localStorage.getItem(k); } catch { return null; } }
function setBest(k, v) { try { localStorage.setItem(k, v); } catch {} }
function getMissed() { try { return JSON.parse(localStorage.getItem("ccarf_missed") || "[]"); } catch { return []; } }
function setMissed(a) { try { localStorage.setItem("ccarf_missed", JSON.stringify(a)); } catch {} }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function label() { return mode === "mock" ? "Mock" : mode === "missed" ? "Missed" : DOMAINS[mode][0]; }

// --- saved mock session: the clock is an absolute deadline, refresh never grants time ---
function saveState() {
  if (mode !== "mock") return;
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      order: Q.map(q => q._orig),
      optOrders: Q.map(q => q.options.map(o => QUESTIONS[q._orig].options.indexOf(o))),
      sels, idx, deadline, flags: [...flags]
    }));
  } catch {}
}
function loadState() { try { return JSON.parse(localStorage.getItem(STATE_KEY)); } catch { return null; } }
function clearState() { try { localStorage.removeItem(STATE_KEY); } catch {} }

function buildQ(oi, order) {
  const q = QUESTIONS[oi];
  const answer = [];
  order.forEach((old, ni) => { if (q.answer.includes(old)) answer.push(ni); });
  return { ...q, _orig: oi, options: order.map(i => q.options[i]), answer };
}
function prep(pool) { return pool.map(q => buildQ(QUESTIONS.indexOf(q), shuffle([...q.options.keys()]))); }
function start(d) { mode = d; stopTimer(); Q = prep(QUESTIONS.filter(q => q.domain === d)); begin(); }
function startMissed() {
  const miss = new Set(getMissed());
  mode = "missed"; stopTimer();
  Q = prep(QUESTIONS.filter((q, i) => miss.has(i)));
  begin();
}
function startMock() {
  mode = "mock";
  const order = shuffle([...QUESTIONS.keys()]);
  Q = order.map(oi => buildQ(oi, shuffle([...QUESTIONS[oi].options.keys()])));
  deadline = Date.now() + 120 * 60 * 1000;
  begin();
  startTimer(deadline);
  saveState();
}
function resumeMock() {
  const s = loadState();
  if (!s || !s.deadline || s.deadline <= Date.now()) { clearState(); return startMock(); }
  mode = "mock";
  Q = s.order.map((oi, j) => buildQ(oi, s.optOrders[j]));
  sels = s.sels; idx = Math.min(s.idx || 0, Q.length - 1); deadline = s.deadline;
  flags = new Set(s.flags || []);
  answers = [];
  render();
  startTimer(deadline);
}
function begin() { idx = 0; answers = []; sels = []; flags = new Set(); render(); }

function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function startTimer(dl) {
  deadline = dl || deadline;
  const bar = document.getElementById("timerbar");
  bar.hidden = false;
  const tick = () => {
    const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
    bar.textContent = "⏱ " + fmt(left) + " left";
    bar.classList.toggle("late", left < 600);
    if (left <= 0) { stopTimer(); submitExam(true); }
  };
  tick();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(tick, 1000);
}
function stopTimer() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  const bar = document.getElementById("timerbar");
  if (bar) { bar.hidden = true; bar.classList.remove("late"); }
}

function render() {
  if (mode === "mock") return renderMock();
  if (idx >= Q.length) return results();
  const q = Q[idx];
  const multi = q.answer.length > 1;
  picked = new Set();
  let h = `<div class="qhead"><span>${label()} · ${idx + 1}/${Q.length}</span><span>${multi ? "pick " + q.answer.length : "pick one"}</span></div>
    <div class="scenario">${esc(q.scenario)}</div>
    <div class="qtext">${esc(q.question)}</div>`;
  q.options.forEach((o, i) => { h += `<button class="opt" id="opt${i}" onclick="pick(${i})"><span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`; });
  h += `<div class="actions"><button class="primary" id="confirm" onclick="grade()" ${multi ? "disabled" : ""}>${multi ? "Submit" : "Check"}</button></div><div id="fb"></div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

// --- Real Mode (mock): Pearson VUE style - no feedback until submit, flag, jump, palette ---
function renderMock() {
  if (idx >= Q.length) idx = Q.length - 1;
  const q = Q[idx];
  picked = new Set(sels[idx] || []);
  const multi = q.answer.length > 1;
  let pal = "";
  for (let i = 0; i < Q.length; i++) {
    const cls = (i === idx ? " cur" : "") + (flags.has(i) ? " flag" : (sels[i] && sels[i].length) ? " done" : "");
    pal += `<button class="pdot${cls}" onclick="goTo(${i})">${i + 1}</button>`;
  }
  let h = `<div class="qhead"><span>Mock · ${idx + 1}/${Q.length}</span><span>${flags.has(idx) ? "⚑ flagged" : multi ? "pick " + q.answer.length : "pick one"}</span></div>
    <div class="scenario">${esc(q.scenario)}</div>
    <div class="qtext">${esc(q.question)}</div>`;
  q.options.forEach((o, i) => {
    h += `<button class="opt${picked.has(i) ? " sel" : ""}" id="opt${i}" onclick="pick(${i})"><span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;
  });
  h += `<div class="actions">
      <button onclick="toggleFlag()">${flags.has(idx) ? "Unflag" : "⚑ Flag"}</button>
      <button onclick="goTo(idx - 1)" ${idx === 0 ? "disabled" : ""}>&#8249; Prev</button>
      <button class="primary" onclick="goTo(idx + 1)">${idx + 1 === Q.length ? "Palette &#8250;" : "Next &#8250;"}</button>
    </div>
    <div class="palette"><div class="pdots">${pal}</div>
    <div class="actions"><button onclick="submitExam()">Submit exam</button></div></div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function goTo(n) { idx = Math.max(0, Math.min(Q.length - 1, n)); if (mode === "mock") saveState(); render(); }
function toggleFlag() { if (flags.has(idx)) flags.delete(idx); else flags.add(idx); saveState(); render(); }

function pick(i) {
  const q = Q[idx], multi = q.answer.length > 1;
  if (mode === "mock") {
    if (!multi) picked = new Set([i]);
    else if (picked.has(i)) picked.delete(i);
    else if (picked.size < q.answer.length) picked.add(i);
    sels[idx] = [...picked].sort();
    saveState();
    q.options.forEach((o, j) => { const el = document.getElementById("opt" + j); if (el) el.classList.toggle("sel", picked.has(j)); });
    const dot = document.querySelectorAll(".pdot")[idx];
    if (dot) dot.classList.toggle("done", sels[idx].length > 0);
    return;
  }
  if (!multi) return grade(i);
  const el = document.getElementById("opt" + i);
  if (picked.has(i)) { picked.delete(i); el.classList.remove("sel"); }
  else { picked.add(i); el.classList.add("sel"); }
  document.getElementById("confirm").disabled = picked.size !== q.answer.length;
}

function submitExam(auto) {
  if (!auto) {
    const un = Q.length - sels.filter(s => s && s.length).length;
    if (!confirm(`Submit exam?${un ? " " + un + " unanswered will score as wrong." : ""}`)) return;
  }
  stopTimer();
  answers = Q.map((q, i) => {
    const sel = sels[i] || [];
    return sel.length === q.answer.length && sel.every((v, j) => v === q.answer[j]);
  });
  clearState();
  results();
}

function grade(forced) {
  const q = Q[idx], multi = q.answer.length > 1;
  const sel = multi ? [...picked].sort() : [forced];
  const correct = sel.length === q.answer.length && sel.every((v, i) => v === q.answer[i]);
  answers.push(correct);
  sels.push(sel.slice());
  q.options.forEach((o, i) => {
    const el = document.getElementById("opt" + i);
    el.disabled = true;
    if (q.answer.includes(i)) el.classList.add("right");
    else if (sel.includes(i)) el.classList.add("wrong");
  });
  document.getElementById("fb").innerHTML = `<div class="explain">
    <div class="verdict" style="color:${correct ? "var(--ok)" : "var(--bad)"}">${correct ? "&#10003; Correct" : "&#10007; Incorrect"}</div>
    ${esc(q.explain)}</div>
    <div class="actions"><button class="primary" onclick="next()">${idx + 1 === Q.length ? "See results" : "Next &#8250;"}</button></div>`;
  document.getElementById("confirm").disabled = true;
  window.scrollTo(0, document.body.scrollHeight);
}

function next() { idx++; render(); }

function results() {
  stopTimer();
  const n = Q.length, right = answers.filter(Boolean).length, pct = Math.round(100 * right / n);
  const scaled = Math.round(100 + 900 * right / n);
  const key = bestKey(), prev = getBest(key);
  if (prev === null || pct > +prev) setBest(key, pct);
  const miss = new Set(getMissed());
  Q.forEach((q, i) => { if (answers[i]) miss.delete(q._orig); else miss.add(q._orig); });
  setMissed([...miss]);
  const target = 90, pass = 72;
  const verdict = pct >= target ? "900-range pace" : pct >= pass ? "Passing pace — keep pushing to 90%" : "Below passing — review the explanations";
  let recap = '<div class="recap">' + answers.map((a, i) => `<span class="${a ? "ok" : "bad"}">${i + 1}</span>`).join("") + "</div>";
  let breakdown = "", drill = "";
  if (mode === "mock") {
    const per = {};
    Q.forEach((q, i) => { (per[q.domain] = per[q.domain] || [0, 0]); per[q.domain][1]++; if (answers[i]) per[q.domain][0]++; });
    let worst = null;
    breakdown = '<div class="breakdown">' + Object.entries(per).map(([d, [r, t]]) => {
      const p = Math.round(100 * r / t);
      if (!worst || p < worst.p) worst = { d: +d, p };
      return `<div class="brow${p < 72 ? " weak" : ""}"><span>${DOMAINS[d][0]}</span><span class="bbar"><span style="width:${p}%"></span></span><span>${r}/${t}</span></div>`;
    }).join("") + "</div>";
    if (worst && worst.p < 90) drill = `<button onclick="start(${worst.d})">Drill ${DOMAINS[worst.d][0]} (${worst.p}%)</button>`;
  }
  const retry = mode === "mock" ? "startMock()" : mode === "missed" ? "startMissed()" : `start(${mode})`;
  app.innerHTML = `<h1>${right}/${n}</h1>
    <div class="score-big">${pct}%</div>
    <div class="verdict-line" style="color:${pct >= target ? "var(--ok)" : pct >= pass ? "var(--accent)" : "var(--bad)"}">${verdict}</div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="sub">scaled ≈ ${scaled}/1000 (pass 720) · target 90% (900+)${prev !== null && pct <= +prev ? " · best " + Math.max(pct, +prev) + "%" : ""}</div>
    ${breakdown}
    ${recap}
    <div class="actions">
      ${drill}<button onclick="review()">Review answers</button>
    </div>
    <div class="actions">
      <button onclick="${retry}">Retry</button>
      <button class="primary" onclick="home()">Done</button>
    </div>`;
}

function review() {
  let h = `<h1>Review</h1><p class="sub">${label()} · your picks marked red, correct answers green</p>`;
  Q.forEach((q, i) => {
    const sel = sels[i] || [];
    const correct = sel.length === q.answer.length && sel.every((v, j) => v === q.answer[j]);
    h += `<div class="rblock"><div class="qhead"><span>${label()} · ${i + 1}</span><span class="${correct ? "rok" : "rbad"}">${correct ? "&#10003; correct" : "&#10007; missed"}</span></div>
      <div class="scenario">${esc(q.scenario)}</div>
      <div class="qtext">${esc(q.question)}</div>`;
    q.options.forEach((o, j) => {
      const cls = q.answer.includes(j) ? "right" : sel.includes(j) ? "wrong" : "";
      h += `<div class="opt ${cls}"><span class="key">${"ABCD"[j]}</span><span>${esc(o)}</span></div>`;
    });
    h += `<div class="explain">${esc(q.explain)}</div></div>`;
  });
  h += `<div class="actions"><button class="primary" onclick="results()">Back to results</button></div>`;
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

function home() {
  stopTimer();
  let h = '<h1>Domain Quiz</h1><p class="sub">Scenario questions authored from the official guide · wrong answers get explanations</p>';
  for (const [d, info] of Object.entries(DOMAINS)) {
    const n = QUESTIONS.filter(q => q.domain === +d).length;
    const b = getBest("ccarf_best_d" + d);
    h += `<button class="card" onclick="start(${d})"><span class="badge">${info[0]}</span>
      <span class="cinfo"><span class="cname">${info[1]}</span>
      <span class="cscore">${info[2]} · ${n} questions${b ? " · best " + b + "%" : ""}</span></span></button>`;
  }
  const miss = getMissed();
  if (miss.length) {
    h += `<button class="card" onclick="startMissed()"><span class="badge" style="background:var(--bad);color:#fff;">&#8635;</span>
      <span class="cinfo"><span class="cname">Retry missed</span>
      <span class="cscore">${miss.length} question${miss.length === 1 ? "" : "s"} you got wrong before</span></span></button>`;
  }
  const saved = loadState();
  if (saved && saved.deadline && saved.deadline > Date.now()) {
    const left = fmt(Math.round((saved.deadline - Date.now()) / 1000));
    const answered = (saved.sels || []).filter(s => s && s.length).length;
    h += `<button class="card" onclick="resumeMock()"><span class="badge" style="background:var(--ok);color:#fff;">&#9654;</span>
      <span class="cinfo"><span class="cname">Resume mock exam</span>
      <span class="cscore">${answered}/${QUESTIONS.length} answered · ${left} left · auto-submits at 0:00</span></span></button>`;
  }
  const mb = getBest("ccarf_best_mock");
  h += `<button class="card" onclick="startMock()"><span class="badge" style="background:var(--accent);color:#fff;">&#9733;</span>
    <span class="cinfo"><span class="cname">Full Mock Exam</span>
    <span class="cscore">${QUESTIONS.length} questions · 120 min · real mode: no feedback, flag &amp; review palette${mb ? " · best " + mb + "%" : ""}</span></span></button>`;
  app.innerHTML = h;
  document.querySelector("nav.top").lastElementChild.classList.add("cur");
}

function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
home();
</script>
</body>
</html>
