<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CCAR-F Study Deck</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #d97757;
    --trap: #c00000;
    --border: #e5e2dc;
    --chip: #ece9e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412;
      --card: #211f1c;
      --text: #f0eee9;
      --muted: #9a968e;
      --accent: #e08b6d;
      --trap: #ff7b6b;
      --border: #38342e;
      --chip: #2b2925;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    touch-action: pan-y;
  }
  .bar { height: 3px; background: var(--border); flex-shrink: 0; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  header {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .55rem .9rem;
    flex-shrink: 0;
  }
  header .count { font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); min-width: 3.2em; }
  .chips { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--chip);
    color: var(--text);
    border-radius: 99px;
    font-size: .7rem;
    padding: .28rem .6rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .chips button.here { background: var(--accent); border-color: var(--accent); color: #fff; }
  main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 .9rem .5rem;
  }
  .slide {
    max-width: 40rem;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem 1.3rem 1.6rem;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  .slide.title-slide { justify-content: center; text-align: center; }
  .slide.title-slide h1 { font-size: clamp(1.6rem, 6vw, 2.3rem); letter-spacing: -.02em; }
  .slide.title-slide .subtitle { color: var(--muted); margin-top: .9rem; font-size: clamp(.95rem, 3.5vw, 1.15rem); }
  .slide.section-slide { justify-content: center; text-align: center; background: var(--accent); border-color: var(--accent); color: #fff; }
  .slide.section-slide h2 { font-size: clamp(1.5rem, 6vw, 2.2rem); letter-spacing: -.02em; }
  .slide.content-slide h2 {
    font-size: clamp(1.25rem, 4.6vw, 1.7rem);
    letter-spacing: -.02em;
    padding-bottom: .9rem;
    margin-bottom: 1.1rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  ul { list-style: none; display: flex; flex-direction: column; gap: .85rem; }
  li { display: flex; gap: .65rem; line-height: 1.45; }
  li::before { content: ""; width: .45em; height: .45em; border-radius: 50%; background: var(--muted); flex-shrink: 0; margin-top: .5em; }
  li.s24 { font-size: clamp(1.1rem, 4vw, 1.35rem); font-weight: 700; }
  li.s22 { font-size: clamp(1rem, 3.7vw, 1.22rem); }
  li.s20 { font-size: clamp(.92rem, 3.4vw, 1.1rem); }
  li.s18 { font-size: clamp(.85rem, 3.1vw, 1rem); color: var(--muted); }
  li.trap::before { background: var(--trap); margin-top: .55em; }
  li.trap { color: var(--trap); }
  footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .5rem .9rem calc(.5rem + env(safe-area-inset-bottom));
  }
  footer button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    font-size: 1.15rem;
    width: 3rem;
    height: 2.4rem;
    cursor: pointer;
  }
  footer button:disabled { opacity: .3; }
  footer .hint { color: var(--muted); font-size: .72rem; }
</style>
</head>
<body>
<div class="bar"><div id="prog"></div></div>
<header>
  <span class="count" id="count"></span>
  <nav class="chips" id="chips"></nav>
</header>
<main id="main"><div class="slide" id="slide"></div></main>
<footer>
  <button id="prev" aria-label="Previous slide">&#8249;</button>
  <span class="hint">swipe &#8592;&#8594; &middot; arrows &middot; chips to jump</span>
  <button id="next" aria-label="Next slide">&#8250;</button>
</footer>

": "Repeats until Claude gives final answer", "size": 22}, {"text": "Every reply carries a flag: stop_reason", "size": 24, "bold": true}, {"text": "stop_reason = \"tool_use\" → run the tool, feed result back, continue", "size": 22}, {"text": "stop_reason = \"end_turn\" → done. Show answer. Stop loop", "size": 22}, {"text": "Tool results APPEND to conversation history — Claude reasons over them next turn", "size": 22}, {"text": "Claude decides WHICH tool next = model-driven (the 'agentic' part)", "size": 22}]}, {"layout": "title_content", "title": "1.1 Loop — Exam Traps", "bullets": [{"text": "TRAP: parsing Claude's TEXT ('I'm done') to detect completion → WRONG", "size": 22, "color": "C00000", "bold": true}, {"text": "Only stop_reason is reliable", "size": 20}, {"text": "TRAP: iteration cap (e.g. max 25 loops) as PRIMARY stop mechanism → WRONG", "size": 22, "color": "C00000", "bold": true}, {"text": "Cap = safety net only, never the design", "size": 20}, {"text": "TRAP: 'answer contains text = finished' → WRONG", "size": 22, "color": "C00000", "bold": true}, {"text": "Claude can output text AND tool calls in the same turn", "size": 20}, {"text": "TRAP: pre-programmed fixed tool sequence → WRONG", "size": 22, "color": "C00000", "bold": true}, {"text": "Correct answer is ALWAYS: check stop_reason", "size": 24, "bold": true}]}, {"layout": "title_content", "title": "1.2 Multi-Agent — Hub and Spoke", "bullets": [{"text": "Boss = coordinator. Specialists = subagents", "size": 22}, {"text": "Hub-and-spoke: ALL communication goes through boss", "size": 24, "bold": true}, {"text": "Subagents NEVER talk directly to each other", "size": 24, "bold": true}, {"text": "Why: observability, consistent error handling, controlled flow", "size": 20}, {"text": "Boss jobs: split work, delegate, collect, aggregate, decide who to invoke", "size": 22}, {"text": "Boss picks team per request — simple query = few/no subagents", "size": 22}, {"text": "TRAP: always running the full pipeline for every request → wasteful", "size": 22, "color": "C00000"}]}, {"layout": "title_content", "title": "1.2 Subagents Start Blank", "bullets": [{"text": "Subagents do NOT inherit boss's conversation or memory", "size": 24, "bold": true}, {"text": "Whatever subagent needs must be IN THE TASK PROMPT itself", "size": 24, "bold": true}, {"text": "Search agent found facts → synthesis agent needs them → boss PASTES facts into synthesis prompt", "size": 22}, {"text": "TRAP: 'subagents share memory automatically' → WRONG", "size": 22, "color": "C00000"}, {"text": "TRAP: splitting tasks TOO NARROW → incomplete coverage, gaps between subtasks", "size": 22, "color": "C00000"}, {"text": "Partition scope to MINIMIZE duplication (distinct subtopics per agent)", "size": 20}, {"text": "Iterative refinement: boss reviews synthesis → finds gap → re-delegates targeted query → re-synthesizes", "size": 22}]}, {"layout": "title_content", "title": "1.3 Task Tool & Parallel Spawning", "bullets": [{"text": "Task tool = how boss spawns subagents", "size": 24, "bold": true}, {"text": "Boss's allowedTools MUST include \"Task\" or it cannot spawn anyone", "size": 24, "bold": true}, {"text": "Each subagent type = AgentDefinition: description, own system prompt, own tool restrictions", "size": 22}, {"text": "E.g. search agent gets ONLY search tools — cannot touch files", "size": 20}, {"text": "PARALLEL: boss emits multiple Task calls in ONE single response", "size": 24, "bold": true}, {"text": "Sequential (task, wait, task, wait) = slower — exam prefers parallel", "size": 20}, {"text": "Pass findings in structured form: content separate from metadata (source URL, doc name, page number)", "size": 22}]}, {"layout": "title_content", "title": "1.3 Writing Task Prompts for Subagents", "bullets": [{"text": "BAD: step-by-step procedure ('first search X, then read Y')", "size": 22, "color": "C00000"}, {"text": "Rigid, fragile, kills adaptability", "size": 20}, {"text": "GOOD: research GOAL + quality criteria", "size": 24, "bold": true}, {"text": "'Find EV sales data for India; include source + date; skip blogs; method up to you'", "size": 22}, {"text": "Subagent figures out its own steps → adapts to what it finds", "size": 22}, {"text": "Structured data passing preserves attribution downstream", "size": 20}]}, {"layout": "title_content", "title": "1.4 Workflow Enforcement & Handoff", "bullets": [{"text": "Prompt instructions = PROBABILISTIC compliance (can fail)", "size": 24, "bold": true}, {"text": "Programmatic enforcement (hooks, gates) = GUARANTEED compliance", "size": 24, "bold": true}, {"text": "When business rules demand certainty (identity check before refund) → enforce programmatically", "size": 22}, {"text": "Pattern: block process_refund until get_customer returned verified ID", "size": 22}, {"text": "Multi-concern request → split into items → investigate in parallel → synthesize one resolution", "size": 22}, {"text": "Escalation handoff = STRUCTURED SUMMARY: customer ID, root cause, refund amount, recommended action", "size": 22}, {"text": "Human agent has no transcript access — summary must stand alone", "size": 20}]}, {"layout": "title_content", "title": "1.5 Agent SDK Hooks", "bullets": [{"text": "Hooks = code that intercepts the agent loop at fixed points", "size": 22}, {"text": "PostToolUse hook: intercepts tool RESULTS before Claude sees them", "size": 24, "bold": true}, {"text": "Use: normalize messy data (Unix vs ISO 8601 timestamps, status codes) from different MCP tools", "size": 22}, {"text": "Tool-call interception hook: blocks policy violations BEFORE execution", "size": 24, "bold": true}, {"text": "E.g. refund > $500 → block → redirect to human escalation", "size": 22}, {"text": "Rule: guaranteed compliance → hook. Flexible guidance → prompt", "size": 24, "bold": true}, {"text": "TRAP: choosing prompt-based enforcement for hard business rules → WRONG", "size": 22, "color": "C00000"}]}, {"layout": "title_content", "title": "1.6 Task Decomposition", "bullets": [{"text": "Two patterns — pick by task type", "size": 22}, {"text": "PROMPT CHaining (fixed sequential pipeline): predictable multi-aspect work", "size": 24, "bold": true}, {"text": "E.g. big code review → analyze each file separately → then cross-file integration pass", "size": 20}, {"text": "DYNAMIC adaptive decomposition: open-ended investigation", "size": 24, "bold": true}, {"text": "Generate subtasks based on what each step DISCOVERS", "size": 20}, {"text": "E.g. 'add tests to legacy codebase' → map structure → find high-impact areas → prioritized adaptive plan", "size": 20}, {"text": "Why split: avoid ATTENTION DILUTION — one pass over everything = shallow findings", "size": 22}, {"text": "TRAP: per-file + integration pass beats single mega-review", "size": 22, "color": "C00000"}]}, {"layout": "title_content", "title": "1.7 Session State: Resume & Fork", "bullets": [{"text": "--resume <session-name> → continue a named prior session", "size": 24, "bold": true}, {"text": "fork_session → branch from shared baseline, explore divergent approaches", "size": 24, "bold": true}, {"text": "E.g. compare two testing strategies from one codebase analysis", "size": 20}, {"text": "After code changed: TELL the resumed session WHICH files changed → targeted re-analysis", "size": 22}, {"text": "Stale tool results? → start NEW session with structured summary (more reliable than resume)", "size": 24, "bold": true}, {"text": "Resume when prior context mostly still valid", "size": 22}, {"text": "TRAP: resuming with stale tool outputs → wrong answers", "size": 22, "color": "C00000"}]}, {"layout": "section", "title": "DOMAIN 2 — Tool Design & MCP (18%)"}, {"layout": "title_content", "title": "2.1 Tool Descriptions = Selection Mechanism", "bullets": [{"text": "Claude picks tools BY DESCRIPTION. Bad description = wrong tool", "size": 24, "bold": true}, {"text": "Include: purpose, input format, example queries, edge cases, boundaries, when NOT to use", "size": 22}, {"text": "Similar tools with vague descriptions → MISROUTING", "size": 22}, {"text": "Classic exam case: analyze_content vs analyze_document, near-identical descriptions", "size": 20}, {"text": "Fixes: rename to purpose-specific (extract_web_results), sharpen descriptions", "size": 22}, {"text": "Or SPLIT generic tool into specific ones:", "size": 22}, {"text": "analyze_document → extract_data_points + summarize_content + verify_claim_against_source", "size": 20}, {"text": "System prompt keywords can create unintended tool associations — review prompts too", "size": 20}]}, {"layout": "title_content", "title": "2.2 Structured Error Responses", "bullets": [{"text": "MCP isError flag = the pattern for reporting tool failure back to agent", "size": 24, "bold": true}, {"text": "Error categories — know all four:", "size": 24, "bold": true}, {"text": "TRANSIENT (timeout, service down) · VALIDATION (bad input) · BUSINESS (policy violation) · PERMISSION (no access)", "size": 20}, {"text": "Return: errorCategory + isRetryable (boolean) + human-readable description", "size": 22}, {"text": "TRAP: uniform errors ('Operation failed') → agent cannot decide how to recover", "size": 22, "color": "C00000"}, {"text": "Retryable=false + friendly explanation for business rule violations", "size": 22}, {"text": "Distinguish: access FAILURE (retry decision needed) vs valid EMPTY result (query worked, no matches)", "size": 22}]}, {"layout": "title_content", "title": "2.2 Local Recovery", "bullets": [{"text": "Subagents handle transient failures THEMSELVES (retry locally)", "size": 24, "bold": true}, {"text": "Escalate to coordinator ONLY unresolvable errors — with partial results + what was attempted", "size": 22}, {"text": "Structured error context = smart coordinator recovery decisions", "size": 20}, {"text": "TRAP: silent suppression (empty result looks like success) → WRONG", "size": 22, "color": "C00000"}, {"text": "TRAP: whole pipeline dies on single subagent failure → WRONG", "size": 22, ervers discovered at connection time, available together", "size": 22}, {"text": "Prefer EXISTING community MCP servers (e.g. Jira) over custom — build custom only for team-specific workflows", "size": 22}]}, {"layout": "title_content", "title": "2.4 MCP Details That Get Tested", "bullets": [{"text": "Weak MCP tool descriptions → Claude prefers BUILT-IN tools (Grep) over better MCP tools", "size": 24, "bold": true}, {"text": "Fix: enhance MCP tool descriptions — capabilities + outputs in detail", "size": 22}, {"text": "MCP RESOURCES = content catalogs (issue summaries, doc trees, DB schemas)", "size": 24, "bold": true}, {"text": "Give visibility into available data WITHOUT exploratory tool calls", "size": 22}, {"text": "TRAP: new teammate missing shared servers → servers were in someone's user config, not project .mcp.json", "size": 22, "color": "C00000"}]}, {"layout": "title_content", "title": "2.5 Built-in Tools", "bullets": [{"text": "Grep = search CONTENT (function names, error strings, imports, callers)", "size": 24, "bold": true}, {"text": "Glob = search FILE NAMES / paths (*.test.tsx, *.py)", "size": 24, "bold": true}, {"text": "Read / Write = full file operations", "size": 22}, {"text": "Edit = targeted change via UNIQUE text match", "size": 22}, {"text": "Edit fails on non-unique anchor text → fallback: Read then Write full file", "size": 24, "bold": true}, {"text": "Explore incrementally: Grep entry points → Read imports → trace flow. NOT read-all-first", "size": 22}, {"text": "Trace usage: find exported names → Grep each name across codebase", "size": 20}]}, {"layout": "section", "title": "DOMAIN 3 — Claude Code Config (20%)"}, {"layout": "title_content", "title": "3.1 CLAUDE.md Hierarchy", "bullets": [{"text": "User level: ~/.claude/CLAUDE.md → personal ONLY, never shared", "size": 24, "bold": true}, {"text": "Project level: CLAUDE.md in root (or .claude/CLAUDE.md) → shared via git", "size": 24, "bold": true}, {"text": "Directory level: subdirectory CLAU const ICONS = { 1: "D1", 2: "D2", 3: "D3", 4: "D4", 5: "D5", 6: "★" };
const els = {
  slide: document.getElementById("slide"),
  count: document.getElementById("count"),
  prog: document.querySelector("#prog div, #prog"),
  chips: document.getElementById("chips"),
  main: document.getElementById("main"),
  prev: document.getElementById("prev"),
  next: document.getElementById("next"),
};
const SECTIONS = SLIDES.map((s, i) => s.layout === "section" ? i : -1).filter(i => i >= 0);

SLIDES.forEach((s, i) => {
  if (s.layout !== "section") return;
  const b = document.createElement("button");
  const n = SECTIONS.indexOf(i);
  b.textContent = ICONS[n + 1] + " " + s.title.replace(/^DOMAIN\s*\d+\s*—\s*|\s*\(\d+%\)$/g, "").split(" ")[0];
  b.onclick = () => go(i);
  els.chips.appendChild(b);
});

function render(n) {
  const s = SLIDES[n];
  const el = els.slide;
  el.className = "slide " + (s.layout === "title" ? "title-slide" : s.layout === "section" ? "section-slide" : "content-slide");
  let html = "";
  if (s.layout === "title") {
    html = "<h1>" + esc(s.title) + "</h1><p class=subtitle>" + esc(s.subtitle || "") + "</p>";
  } else if (s.layout === "section") {
    html = "<h2>" + esc(s.title) + "</h2>";
  } else {
    html = "<h2>" + esc(s.title) + "</h2><ul>" + (s.bullets || []).map(b =>
      "<li class=\"s" + (b.size || 20) + (b.color === "C00000" ? " trap" : "") + "\">" + esc(b.text) + "</li>"
    ).join("") + "</ul>";
  }
  el.innerHTML = html;
  els.count.textContent = (n + 1) + "/" + SLIDES.length;
  els.prog.style.width = (100 * (n + 1) / SLIDES.length) + "%";
  els.prev.disabled = n === 0;
  els.next.disabled = n === SLIDES.length - 1;
  document.querySelectorAll(".chips button").forEach((b, i) =>
    b.classList.toggle("here", SECTIONS[i] <= n && (i === SECTIONS.length - 1 || SECTIONS[i + 1] > n)));
  document.querySelector(".chips button.here")?.scrollIntoView({ block: "nearest", inline: "center" });
  els.main.scrollTop = 0;
  history.replaceState(null, "", "#" + (n + 1));
}
function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function go(n) { n = Math.max(0, Math.min(SLIDES.length - 1, n)); render(n); }

els.prev.onclick = () => go(cur() - 1);
els.next.onclick = () => go(cur() + 1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") go(cur() + 1);
  if (e.key === "ArrowLeft") go(cur() - 1);
});
let x0 = null;
addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 55 && els.main.scrollTop < 4) go(cur() + (dx < 0 ? 1 : -1));
  x0 = null;
}, { passive: true });
function cur() { return parseInt(location.hash.slice(1)) - 1 || 0; }
addEventListener("hashchange", () => render(cur()));
render(cur());
